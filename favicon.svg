<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="DossierOntario">
  <!-- L'icône de DossierOntario : « ONT » en crème sur le rouge du Red Ensign (#C8102E),
       l'accent ontarien de la Charte Dossier.

       Les lettres sont dessinées, pas écrites : un favicon ne peut pas compter sur
       Archivo, qui n'est pas installé chez le visiteur. Tracées à la main, elles gardent
       la même forme partout — et elles restent carrées, comme tout le reste du site.

       Le trait fait 4 unités sur 64, et le vide entre les deux montants du N en fait 8 :
       en deçà, la diagonale bouche le contre-poinçon et la lettre devient un pâté.

       Pas d'armoiries, pas de drapeau : un site non officiel ne doit jamais ressembler à
       un site du gouvernement. La couleur suffit. -->
  <rect width="64" height="64" fill="#C8102E"/>
  <g fill="#F2F0EA">
    <!-- O : un anneau carré (règle du pair-impair pour évider le centre) -->
    <path d="M6 20 H22 V44 H6 Z M10 24 V40 H18 V24 Z" fill-rule="evenodd"/>
    <!-- N : deux montants et une diagonale qui les relie d'un coin à l'autre -->
    <rect x="24" y="20" width="4" height="24"/>
    <rect x="36" y="20" width="4" height="24"/>
    <polygon points="28,20 32,20 40,44 36,44"/>
    <!-- T : une barre et un fût -->
    <rect x="42" y="20" width="16" height="4"/>
    <rect x="48" y="20" width="4" height="24"/>
  </g>
</svg>
