# Les résumés des séances de la Chambre, chaque jour (16 nov. 2026), copiés du mécanisme de DossierBC.
#
# Le grand rafraîchissement (refresh.yml) ne passe que le lundi et prend 50 minutes. Ce petit travail
# ne lit que la liste des séances et les nouvelles transcriptions (scrapers/hansard-resumes.js), résume
# chaque séance UNE fois (environ 0,20 $ US) et ne publie que data/site/hansard-resumes.json, lu
# directement par commun/seances.js. Un jour sans séance : rien à résumer, rien ne coûte.

name: Séances de la Chambre

on:
  schedule:
    - cron: '45 11 * * *' # 7 h 45 (heure de l'Est), chaque jour
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  seances:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - name: Résumer les nouvelles séances
        if: env.ANTHROPIC_API_KEY != ''
        run: node scrapers/hansard-resumes.js

      - name: Publier s'il y a du neuf
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/site/hansard-resumes.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo 'Aucune séance nouvelle.'
          else
            git commit -m "Séances de la Chambre au $(date -u +%Y-%m-%d)"
            for essai in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
